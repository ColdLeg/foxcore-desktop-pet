[package]
name = "foxcore-desktop-pet"
version = "0.1.0"
edition = "2024"
description = "FoxCore 桌宠插件（透明无边框置顶窗 + 活力值引擎）"
license-file = "LICENSE"
rust-version = "1.92"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# ABI 1.6 = FoxNature v0.2.0 主程序匹配版本（SDK 0.2.0）
foxcore-plugin-sdk = { git = "https://github.com/KitsuneFlora/foxcore-plugin-sdk", rev = "9699911b1f0f5bcdf86222957f74e43f7824481b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# GUI（桌宠窗口）
eframe = "0.29"
egui = "0.29"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
