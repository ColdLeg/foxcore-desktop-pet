[package]
name = "foxcore-desktop-pet"
version = "0.1.0"
edition = "2024"
description = "FoxCore 桌宠插件（透明无边框置顶窗 + 活力值引擎）"
license-file = "LICENSE"
rust-version = "1.92"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# ABI 1.7 = FoxNature 最新主程序匹配版本（SDK 0.3.0）
foxcore-plugin-sdk = { git = "https://github.com/KitsuneFlora/foxcore-plugin-sdk", rev = "e26be665b00df5d2fb1e62c1b3ce5a0c33ba578c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# GUI（桌宠窗口）
eframe = "0.29"
egui = "0.29"

# winit（仅 Windows）：桌宠 GUI 跑在非主线程，需通过 EventLoopBuilderExtWindows::with_any_thread(true)
# 才能在子线程创建 EventLoop，否则 winit 0.30 会直接 panic。
[target.'cfg(windows)'.dependencies]
winit = "0.30"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
